    function getCookie(name) {
      const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
      return m ? decodeURIComponent(m[1]) : null;
    }
    function setCookie(name, val) {
      document.cookie = name + '=' + encodeURIComponent(val) + ';path=/;max-age=31536000;SameSite=Lax';
    }

    function detectLang() {
      const saved = getCookie('ijwi_lang');
      if (saved && T[saved]) return saved;
      const nav = (navigator.language || '').toLowerCase();
      if (nav.startsWith('fr')) return 'fr';
      if (nav.startsWith('nl')) return 'nl';
      return 'en';
    }

    function scrollTo(id) {
      document.getElementById(id)?.scrollIntoView({ behavior: "smooth" });
    }

    function useInView(threshold = 0.12) {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setVisible(true); }, { threshold });
        obs.observe(el);
        return () => obs.disconnect();
      }, []);
      return [ref, visible];
    }

    function FadeIn({ children, delay = 0, style = {} }) {
      const [ref, visible] = useInView();
      return (
        <div ref={ref} style={{
          opacity: visible ? 1 : 0, transform: visible ? "translateY(0)" : "translateY(28px)",
          transition: `opacity 0.7s ease ${delay}s, transform 0.7s ease ${delay}s`, ...style,
        }}>{children}</div>
      );
    }

    function AnimCount({ target, suffix = "", prefix = "" }) {
      const [val, setVal] = useState(0);
      const [ref, visible] = useInView();
      useEffect(() => {
        if (!visible) return;
        let start = 0;
        const step = target / 120;
        const id = setInterval(() => {
          start += step;
          if (start >= target) { setVal(target); clearInterval(id); }
          else setVal(Math.floor(start));
        }, 16);
        return () => clearInterval(id);
      }, [visible, target]);
      return <span ref={ref}>{prefix}{val.toLocaleString()}{suffix}</span>;
    }

    function WaveBar({ delay }) {
      return <div style={{ width: 3, borderRadius: 2, backgroundColor: C.orange, animation: `wave 1.2s ease-in-out ${delay}s infinite` }} />;
    }

    function SectionLabel({ color, children }) {
      return <div style={{ fontSize: 12, fontWeight: 700, color, textTransform: "uppercase", letterSpacing: "0.18em", marginBottom: 16 }}>{children}</div>;
    }

    function TerminalLine({ prompt, command, output, delay = 0 }) {
      const [ref, visible] = useInView();
      return (
        <div ref={ref} style={{ opacity: visible ? 1 : 0, transform: visible ? "translateX(0)" : "translateX(-10px)", transition: `all 0.5s ease ${delay}s` }}>

                  { icon: "\uD83D\uDD0A", title: t.infraTTS, desc: t.infraTTSDesc, color: C.teal },
                  { icon: "\uD83D\uDD04", title: t.infraTranslation, desc: t.infraTranslationDesc, color: C.gold },
                ].map((p, i) => (
                  <FadeIn key={i} delay={i * 0.1}>
                    <div style={{ padding: 24, backgroundColor: C.card, borderRadius: 14, border: `1px solid ${C.border}`, height: "100%" }}>
                      <div style={{ fontSize: 28, marginBottom: 10 }}>{p.icon}</div>
                      <div style={{ fontSize: 16, fontWeight: 800, color: p.color, marginBottom: 8 }}>{p.title}</div>
                      <div style={{ fontSize: 13, color: C.dim, lineHeight: 1.6 }}>{p.desc}</div>
                    </div>
                  </FadeIn>
                ))}
              </div>
            </div>
          </section>

          {/* QUOTE */}
          <section style={{ padding: "80px 24px", textAlign: "center", maxWidth: 700, margin: "0 auto" }}>
            <FadeIn>
              <div style={{ fontSize: "clamp(20px, 3.2vw, 30px)", fontWeight: 300, fontStyle: "italic", lineHeight: 1.6, color: C.dim, marginBottom: 20 }}>
                {t.quoteText}
              </div>
              <div style={{ fontSize: 14, fontWeight: 700, color: C.white }}>Satya Nadella</div>
              <div style={{ fontSize: 12, color: C.dimmer }}>{t.quoteSub}</div>
              <div style={{ marginTop: 24, padding: "12px 20px", display: "inline-block", borderRadius: 10, backgroundColor: C.card, border: `1px solid ${C.border}` }}>
                <span style={{ fontSize: 13, color: C.orange, fontWeight: 600 }}>{t.quoteCaption}</span>
              </div>
            </FadeIn>
          </section>

          {/* MARKET */}
          <section style={{ padding: "80px 24px", backgroundColor: C.bgSub, borderTop: `1px solid ${C.border}`, borderBottom: `1px solid ${C.border}` }}>
            <div style={{ maxWidth: 820, margin: "0 auto" }}>
              <FadeIn>
                <SectionLabel color={C.gold}>{t.marketLabel}</SectionLabel>
                <h2 style={{ fontFamily: "'Syne', sans-serif", fontSize: "clamp(24px, 3.5vw, 34px)", fontWeight: 800, marginBottom: 40, letterSpacing: "-0.02em" }}>
                  {t.marketH}
                </h2>
              </FadeIn>
              <div className="stats-grid" style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 14 }}>
                {[
                  { value: <AnimCount target={67} prefix="$" suffix="B" />, label: t.marketMobile, color: C.gold },
                  { value: "89%", label: t.marketUSSD, color: C.red },
                  { value: <AnimCount target={1400} suffix="M" />, label: t.marketPeople, color: C.white },
                  { value: <AnimCount target={2000} suffix="+" />, label: t.marketLangs, color: C.orange },
                  { value: "<10", label: t.marketSupported, color: C.red },
                  { value: "0", label: t.marketAgents, color: C.red },
                ].map((s, i) => (
                  <FadeIn key={i} delay={i * 0.05}>
                    <div style={{ padding: 22, backgroundColor: C.card, borderRadius: 12, border: `1px solid ${C.border}`, textAlign: "center" }}>
                      <div style={{ fontSize: 28, fontWeight: 800, fontFamily: "'Syne', sans-serif", color: s.color, marginBottom: 6 }}>{s.value}</div>
                      <div style={{ fontSize: 12, color: C.dim, lineHeight: 1.4 }}>{s.label}</div>
                    </div>
                  </FadeIn>
                ))}
              </div>
            </div>
          </section>

          {/* LANGUAGES */}
          <section id="languages" style={{ padding: "80px 24px", maxWidth: 820, margin: "0 auto" }}>
            <FadeIn>
              <SectionLabel color={C.teal}>{t.langsLabel}</SectionLabel>
              <h2 style={{ fontFamily: "'Syne', sans-serif", fontSize: "clamp(24px, 3.5vw, 34px)", fontWeight: 800, marginBottom: 40 }}>
                {t.langsH}
              </h2>
            </FadeIn>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {LANGS_DATA.map((l, i) => {
                const statusLabel = LANG_STATUS[lang][l.status];
                return (
                <FadeIn key={i} delay={i * 0.08}>
                  <div style={{
                    display: "flex", alignItems: "center", gap: 14, padding: "16px 18px",
                    backgroundColor: C.card, borderRadius: 12, border: `1px solid ${C.border}`,
                    opacity: l.status === "Soon" ? 0.45 : 1,
                  }}>
                    <span style={{ fontSize: 28 }}>{l.flag}</span>
                    <div style={{ flex: 1 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                        <span style={{ fontSize: 15, fontWeight: 700 }}>
                          {l.name} <span style={{ fontSize: 12, fontWeight: 400, color: C.dim }}>&middot; {l.speakers}</span>
                        </span>
                        <span style={{
                          fontSize: 10, fontWeight: 700, padding: "3px 8px", borderRadius: 4,
                          fontFamily: "'JetBrains Mono', monospace",
                          color: l.status === "Active" ? C.green : l.status === "Collecting" ? C.gold : C.dimmer,
                          backgroundColor: l.status === "Active" ? "rgba(52,199,89,0.08)" : l.status === "Collecting" ? "rgba(212,160,23,0.08)" : "rgba(74,71,64,0.08)",
                        }}>{statusLabel}</span>
                      </div>
                      <div style={{ height: 5, borderRadius: 3, backgroundColor: C.bg }}>
                        <div style={{ height: "100%", borderRadius: 3, backgroundColor: C.orange, width: `${l.pct}%`, transition: "width 1.5s ease" }} />
                      </div>
                    </div>
                    <div style={{ fontSize: 14, fontWeight: 800, color: C.orange, minWidth: 36, textAlign: "right", fontFamily: "'JetBrains Mono', monospace" }}>{l.pct}%</div>
                  </div>
                </FadeIn>
                );
              })}
            </div>
          </section>

          {/* COLLECT */}
          <section id="collect" style={{
            padding: "80px 24px", backgroundColor: C.bgSub,
            borderTop: `1px solid ${C.border}`, borderBottom: `1px solid ${C.border}`,
          }}>
            <div style={{ maxWidth: 820, margin: "0 auto" }}>
              <FadeIn>
                <SectionLabel color={C.orange}>{t.collectLabel}</SectionLabel>
                <h2 style={{ fontFamily: "'Syne', sans-serif", fontSize: "clamp(26px, 4vw, 38px)", fontWeight: 800, marginBottom: 12 }}>{t.collectH}</h2>
                <p style={{ fontSize: 16, color: C.dim, maxWidth: 520, lineHeight: 1.7, marginBottom: 40 }}>
                  {t.collectP}
                </p>
              </FadeIn>
              <div className="features-grid" style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(190px, 1fr))", gap: 12 }}>
                {[
                  { icon: "\uD83C\uDFA4", title: t.collectRecord, desc: t.collectRecordDesc },
                  { icon: "\uD83D\uDD25", title: t.collectStreaks, desc: t.collectStreaksDesc },
                  { icon: "\uD83C\uDFC6", title: t.collectLeaderboards, desc: t.collectLeaderboardsDesc },
                  { icon: "\u2B50", title: t.collectBadges, desc: t.collectBadgesDesc },
                  { icon: "\uD83C\uDFAF", title: t.collectChallenges, desc: t.collectChallengesDesc },
                  { icon: "\u2705", title: t.collectValidate, desc: t.collectValidateDesc },
                ].map((f, i) => (
                  <FadeIn key={i} delay={i * 0.06}>
                    <div style={{ padding: 22, backgroundColor: C.card, borderRadius: 12, border: `1px solid ${C.border}`, textAlign: "center", height: "100%" }}>
                      <div style={{ fontSize: 28, marginBottom: 8 }}>{f.icon}</div>
                      <div style={{ fontSize: 14, fontWeight: 800, marginBottom: 6 }}>{f.title}</div>
                      <div style={{ fontSize: 12, color: C.dim, lineHeight: 1.5 }}>{f.desc}</div>
                    </div>
                  </FadeIn>
                ))}
              </div>
              <FadeIn delay={0.4}>
                <div style={{
                  marginTop: 32, padding: 28, borderRadius: 14, textAlign: "center",
                  border: `1px dashed rgba(224,125,56,0.2)`, backgroundColor: "rgba(224,125,56,0.03)",
                }}>
                  <div style={{ fontSize: 14, fontWeight: 700, color: C.orange, marginBottom: 4 }}>{"\uD83D\uDCF1"} {t.collectComing}</div>
                  <div style={{ fontSize: 13, color: C.dim }}>{t.collectBuiltWith}</div>
                </div>
              </FadeIn>
            </div>
          </section>

          {/* FLYWHEEL */}
          <section style={{ padding: "80px 24px", maxWidth: 700, margin: "0 auto", textAlign: "center" }}>
            <FadeIn>
              <SectionLabel color={C.orange}>{t.flywheelLabel}</SectionLabel>
              <h2 style={{ fontFamily: "'Syne', sans-serif", fontSize: "clamp(24px, 3.5vw, 34px)", fontWeight: 800, marginBottom: 40 }}>
                {t.flywheelH}
              </h2>
            </FadeIn>
            <div style={{ display: "flex", flexDirection: "column", gap: 0, alignItems: "center" }}>
              {[
                { step: "01", title: t.fw1Title, desc: t.fw1Desc, color: C.orange },
                { step: "02", title: t.fw2Title, desc: t.fw2Desc, color: C.teal },
                { step: "03", title: t.fw3Title, desc: t.fw3Desc, color: C.gold },
                { step: "04", title: t.fw4Title, desc: t.fw4Desc, color: C.green },
                { step: "05", title: t.fw5Title, desc: t.fw5Desc, color: C.orange },
              ].map((s, i) => (
                <FadeIn key={i} delay={i * 0.08}>
                  <div style={{ display: "flex", alignItems: "center", gap: 16, marginBottom: 6 }}>
                    <div style={{
                      width: 40, height: 40, borderRadius: 20, border: `2px solid ${s.color}44`,
                      display: "flex", alignItems: "center", justifyContent: "center",
                      fontSize: 13, fontWeight: 800, color: s.color, fontFamily: "'JetBrains Mono', monospace",
                      flexShrink: 0,
                    }}>{s.step}</div>
                    <div style={{ textAlign: "left" }}>
                      <div style={{ fontSize: 15, fontWeight: 700, color: C.white }}>{s.title}</div>
                      <div style={{ fontSize: 12, color: C.dim }}>{s.desc}</div>
                    </div>
                  </div>
                  {i < 4 && <div style={{ width: 2, height: 20, backgroundColor: C.border, marginLeft: 19 }} />}
                </FadeIn>
              ))}
            </div>
          </section>

          {/* DATA GOVERNANCE */}
          <section style={{
            padding: "80px 24px", backgroundColor: C.bgSub,
            borderTop: `1px solid ${C.border}`, borderBottom: `1px solid ${C.border}`,
          }}>
            <div style={{ maxWidth: 700, margin: "0 auto" }}>
              <FadeIn>
                <SectionLabel color={C.gold}>{t.govLabel}</SectionLabel>
                <h2 style={{ fontFamily: "'Syne', sans-serif", fontSize: "clamp(24px, 3.5vw, 34px)", fontWeight: 800, marginBottom: 12 }}>
                  {t.govH}
                </h2>
                <p style={{ fontSize: 15, color: C.dim, lineHeight: 1.7, marginBottom: 32, maxWidth: 500 }}>
                  {t.govP}
                </p>
              </FadeIn>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {[
                  { icon: "\u2705", text: t.govR1, color: C.teal },
                  { icon: "\uD83D\uDCB0", text: t.govR2, color: C.gold },
                  { icon: "\uD83D\uDD04", text: t.govR3, color: C.orange },
                  { icon: "\uD83D\uDD12", text: t.govR4, color: C.white },
                  { icon: "\uD83D\uDCDC", text: t.govR5, color: C.white },
                ].map((r, i) => (
                  <FadeIn key={i} delay={i * 0.06}>
                    <div style={{
                      display: "flex", alignItems: "center", gap: 12, padding: "12px 16px",
                      backgroundColor: C.card, borderRadius: 9, border: `1px solid ${C.border}`,
                    }}>
                      <span style={{ fontSize: 18 }}>{r.icon}</span>
                      <span style={{ fontSize: 13, fontWeight: 600, color: r.color }}>{r.text}</span>
                    </div>
                  </FadeIn>
                ))}
              </div>
            </div>
          </section>

          {/* ECOSYSTEM */}
          <section style={{ padding: "60px 24px", maxWidth: 700, margin: "0 auto", textAlign: "center" }}>
            <FadeIn>
              <div style={{ fontSize: 13, color: C.dimmer, fontWeight: 600, marginBottom: 20 }}>{t.ecoLabel}</div>
              <div style={{ display: "flex", justifyContent: "center", gap: 20, flexWrap: "wrap", marginBottom: 24 }}>
                {["Masakhane", "Digital Umuganda", "Mbaza NLP", "Mozilla Common Voice"].map((p, i) => (
                  <span key={i} style={{ fontSize: 13, fontWeight: 600, color: C.dim }}>{p}</span>
                ))}
              </div>
              <div style={{ display: "flex", justifyContent: "center", gap: 12, flexWrap: "wrap" }}>
                {["Whisper", "Meta MMS", "VITS", "FastAPI", "React Native", "Supabase", "Python"].map((tt, i) => (
                  <span key={i} style={{
                    fontSize: 11, fontWeight: 600, color: C.dimmer, padding: "5px 12px",
                    borderRadius: 5, border: `1px solid ${C.border}`, fontFamily: "'JetBrains Mono', monospace",
                  }}>{tt}</span>
                ))}
              </div>
            </FadeIn>
          </section>

          {/* WAITLIST */}
          <section id="waitlist" style={{
            padding: "100px 24px", textAlign: "center",
            background: `radial-gradient(ellipse at 50% 100%, ${C.orangeGlow} 0%, transparent 50%), ${C.bgSub}`,
            borderTop: `1px solid ${C.border}`,
          }}>
            <FadeIn>
              <h2 style={{ fontFamily: "'Syne', sans-serif", fontSize: "clamp(28px, 4.5vw, 44px)", fontWeight: 800, marginBottom: 12 }}>
                {t.waitH}
              </h2>
              <p style={{ fontSize: 15, color: C.dim, maxWidth: 460, margin: "0 auto 28px", lineHeight: 1.6 }}>
                {t.waitP}
              </p>
            </FadeIn>

            {!submitted ? (
              <form onSubmit={handleWaitlist}
                style={{ display: "flex", gap: 10, maxWidth: 420, margin: "0 auto", flexWrap: "wrap", justifyContent: "center" }}>
                <input type="email" value={email} onChange={(e) => setEmail(e.target.value)}
                  placeholder={t.waitPlaceholder} required
                  style={{
                    flex: 1, minWidth: 220, padding: "13px 16px", borderRadius: 9,
                    border: `1px solid ${C.border}`, backgroundColor: C.card, color: C.white,
                    fontSize: 14, fontFamily: "'Outfit', sans-serif", outline: "none",
                  }} />
                <button type="submit" disabled={submitting} style={{
                  padding: "13px 24px", borderRadius: 9, border: "none",
                  backgroundColor: submitting ? C.dimmer : C.orange, color: C.bg, fontSize: 14,
                  fontWeight: 700, cursor: submitting ? "wait" : "pointer", fontFamily: "'Outfit', sans-serif",
                  transition: "background-color 0.2s",
                }}>{submitting ? t.waitBtnLoading : t.waitBtn}</button>
              </form>
            ) : (
              <div style={{
                display: "inline-flex", alignItems: "center", gap: 10, padding: "14px 24px",
                backgroundColor: "rgba(42,161,152,0.08)", borderRadius: 10, border: `1px solid rgba(42,161,152,0.2)`,
              }}>
                <span style={{ fontSize: 20 }}>{"\uD83C\uDF89"}</span>
                <span style={{ fontSize: 15, fontWeight: 700, color: C.teal }}>{t.waitSuccess}</span>
              </div>
            )}
            <div style={{ marginTop: 16, fontSize: 12, color: C.dimmer }}>{t.waitDisclaimer}</div>
          </section>

          {/* FOOTER */}
          <footer style={{
            padding: "40px 24px", display: "flex", justifyContent: "space-between", alignItems: "center",
            maxWidth: 820, margin: "0 auto", flexWrap: "wrap", gap: 12,
          }}>
            <div>
              <div style={{ fontFamily: "'Syne', sans-serif", fontSize: 16, fontWeight: 800 }}>
                ijwi<span style={{ color: C.orange }}>.</span>ai
              </div>
              <div style={{ fontSize: 11, color: C.dimmer }}>{t.footerTag}</div>
            </div>
            <div style={{ display: "flex", gap: 16 }}>
              <a href="https://github.com/adiking4804/ijwi-ai" target="_blank" style={{ fontSize: 12, fontWeight: 500, color: C.dim }}>GitHub</a>
              <a href="https://masakhane.io" target="_blank" style={{ fontSize: 12, fontWeight: 500, color: C.dim }}>Masakhane</a>
              <a href="mailto:awadi@ijwi-ai.com" style={{ fontSize: 12, fontWeight: 500, color: C.dim }}>Contact</a>
            </div>
          </footer>
          <div style={{ textAlign: "center", padding: "12px 24px 28px", fontSize: 11, color: C.dimmer }}>
            {t.footerCopy}
          </div>
        </div>
        </LangCtx.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
